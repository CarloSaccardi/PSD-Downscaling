# =========================
# GENERAL OPTIONS
# =========================
# dataset_cerra: "/projects/0/prjs1154/CentralEurope_2014_2020/CERRA"
dataset_era5: "/aspire/CarloData/CERRA-ERA5-processing/zz_processed_data/EURASIA"
model: Swin-Unetr                  # Model architecture
subset_ds: 0                       # 0 = full dataset, >0 = subset size
seed: 32
n_workers: 8                       # Dataloader workers
load: null
restore_opt: 1                     # 0 = do not restore optimizer
precision: "16-mixed"              # 32 | 16 | 16-mixed | bf16
eval: null                         # val | test | null → train
wandb_project: Swin-simMIM                #UNet-Cnn               # Optional wandb project name
run_name: Swin-Debug               # Optional run name

# =========================
# DATASET SETTINGS
# =========================
output_variables: null             # List of vars to predict
img_in_channels: 11
img_out_channels: 11
img_resolution: [384, 384]
use_light_decoder: True

# =========================
# MASKING SETTINGS
# =========================
mask_ratio: 0.6                     # Ratio of input to mask
model_patch_size: 2
mask_patch_size: 32

# =========================
# MODEL SETTINGS
# =========================
embedding_type: zero
model_channels: 96
channel_mult: [1, 2, 2]
attn_resolutions: [16]
model_type: SwinUNETR

# =========================
# TRAINING SETTINGS
# =========================
val_interval: 1
lr: 2.0e-4
epochs: 200
batch_size: 8
lr_decay: 1
lr_rampup: 0
grad_clip_threshold: null          # Set a number to enable clipping
checkpoint_level: 0
